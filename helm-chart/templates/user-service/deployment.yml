apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: {{ .Values.userService.replicas }}

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      imagePullSecrets:
        - name: ecr-secret

      containers:
        - name: user-service
          image: "{{ .Values.userService.image }}:{{ .Values.userService.tag }}"
          ports:
            - containerPort: {{ .Values.userService.containerPort }}
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: USER_SPRING_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_DATASOURCE_USERNAME

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: SPRING_DATASOURCE_PASSWORD

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.userService.containerPort }}
            initialDelaySeconds: {{ .Values.userService.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.userService.readinessProbe.periodSeconds }}

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.userService.containerPort }}
            initialDelaySeconds: {{ .Values.userService.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.userService.livenessProbe.periodSeconds }}