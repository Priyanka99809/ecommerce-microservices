apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-db
spec:
  replicas: {{ .Values.userDB.replicas }}

  selector:
    matchLabels:
      app: user-db

  template:
    metadata:
      labels:
        app: user-db

    spec:
      containers:
        - name: user-db
          image: "{{ .Values.userDB.image }}:{{ .Values.userDB.tag }}"
          ports:
            - containerPort: {{ .Values.userDB.containerPort}}
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: USER_MYSQL_DATABASE

            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MYSQL_ROOT_PASSWORD

          startupProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - "-h"
                - "127.0.0.1"
                - "-uroot"
                - "-proot"
            periodSeconds: 5
            failureThreshold: 30

          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql

      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: {{ .Values.userDB.claimName }}