apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: {{ .Values.orderService.replicas }}

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      imagePullSecrets:
        - name: ecr-secret

      containers:
        - name: order-service
          image: "{{ .Values.orderService.image }}:{{ .Values.orderService.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.orderService.containerPort }}
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ORDER_SPRING_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_DATASOURCE_USERNAME

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: SPRING_DATASOURCE_PASSWORD

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.orderService.containerPort }}
            initialDelaySeconds: {{ .Values.orderService.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.orderService.readinessProbe.periodSeconds }}

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.orderService.containerPort }}
            initialDelaySeconds: {{ .Values.orderService.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.orderService.livenessProbe.periodSeconds }}