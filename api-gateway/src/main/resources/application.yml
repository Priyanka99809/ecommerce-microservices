spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: order-service
          uri: http://order-service
          predicates:
           - Path=/orders/**

        - id: user-service
          uri: http://user-service
          predicates:
            - Path=/users/**

        - id: product-service
          uri: http://product-service
          predicates:
            - Path=/products/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
